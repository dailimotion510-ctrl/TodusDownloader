
name: Compilar TodusDownloader

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer proyecto
        run: unzip -o TodusDownloader-1.zip -d extracted

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Encontrar proyecto Android
        id: project
        run: |
          FILE=$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$FILE" ]; then
            echo "No se encontró settings.gradle"
            find extracted -maxdepth 5 -type f
            exit 1
          fi
          DIR=$(dirname "$FILE")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto encontrado en: $DIR"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Compilar APK
        run: |
          gradle -p "${{ steps.project.outputs.dir }}" assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: TodusDownloader-APK
          path: extracted/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
